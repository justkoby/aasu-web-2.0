<!doctype html>
<html lang="en" data-font-pair="lufga-inter">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All-Africa Students Union (AASU) | The Continental Voice of Africa's Students</title>
    <meta
      name="description"
      content="The official website of the All-Africa Students Union (AASU). Representing the interests and aspirations of African students since 1972."
    />
    <meta name="theme-color" content="#101114" />
    <link rel="icon" type="image/svg+xml" href="/images/brand/aasu-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('aasu-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = storedTheme ? storedTheme === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', isDark);

          var storedFont = localStorage.getItem('aasu-font-pair');
          if (
            storedFont === 'lufga-inter' ||
            storedFont === 'lufga-lufga' ||
            storedFont === 'manrope-inter'
          ) {
            document.documentElement.dataset.fontPair = storedFont;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
